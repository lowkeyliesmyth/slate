# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  actionlint:
    desc: Analyze GitHub Actions workflows
    cmds:
      #- actionlint
      - zizmor .

  actionlint:fix:
    desc: Analyze and fix GHA workflows
    cmds:
      - zizmor . --fix=all

  default:
    desc: Run default spec-lint checks
    deps: [spec, lint]

  docs:
    desc: Generates API usage docs from inline docstrings
    cmds:
      - crystal docs

  lint:
    desc: Run Ameba linter
    deps: [lint:build]
    cmds:
      - bin/ameba

  lint:build:
    desc: Compile ameba linter
    cmds:
      - shards install
      - mkdir -p bin
      - crystal build -o bin/ameba lib/ameba/bin/ameba.cr
    status:
      - test -x bin/ameba
      - test bin/ameba -nt shard.lock

  lint:fix:
    desc: Address fixable linter violations
    deps: [lint:build]
    cmds:
      - bin/ameba --fix

  spec:
    desc: Run Crystal specs
    deps: [pg:up]
    cmds:
      - crystal spec --order random

  spec:unit:
    desc: Run db-free Slate specs
    cmds:
      - crystal spec spec/slate --order random

  pg:up:
    desc: Docker compose postgres up
    cmds:
      - docker compose up -d postgres

  pg:down:
    desc: Docker compose postgres down
    cmds:
      - docker compose down postgres
